name: Build and Package DiscImageStudio (English)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Dependencies
        run: dotnet restore DiscImageStudio.slnx

      - name: Build Solution (Release)
        run: dotnet build DiscImageStudio.slnx --configuration Release --no-restore

      - name: Run Architecture Regression Tests
        run: dotnet run --project tests/DiscImageStudio.ArchitectureTests --configuration Release --no-build
        continue-on-error: true

      - name: Run DVD Engine Selftest
        run: dotnet run --project src/DvdImageSolver --configuration Release --no-build -- selftest

      - name: Run DiscImageStudio CLI Selftest
        run: dotnet run --project src/DiscImageStudio.App --configuration Release --no-build -- selftest

      - name: Smoke-Test CD Module
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path artifacts\ci -Force | Out-Null
          dotnet run --project src/DiscImageStudio.App --configuration Release --no-build -- cd-generate --input src/DiscImageStudio.App/Assets/DiscImageStudio-256.png --output artifacts/ci/cd-smoke.raw --r0 24.5 --r1 24.6 --sectors 2 --velocity 1100 --theta0 0 --outer 57.5 --interleave true
          if ($LASTEXITCODE -ne 0) { throw "CD smoke generation failed." }
          if ((Get-Item artifacts\ci\cd-smoke.raw).Length -ne 4704) {
            throw "CD smoke output was not exactly two 2352-byte sectors."
          }

      - name: Publish Standalone Executable (Windows x64)
        shell: powershell
        run: |
          dotnet publish src/DiscImageStudio.App/DiscImageStudio.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output artifacts/publish/win-x64

          Compress-Archive -Path artifacts/publish/win-x64/* -DestinationPath artifacts/DiscImageStudio-English-win-x64.zip -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiscImageStudio-English-win-x64
          path: artifacts/DiscImageStudio-English-win-x64.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release (On Tag or Main Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/DiscImageStudio-English-win-x64.zip
          name: DiscImageStudio English ${{ github.ref_name }}
          draft: false
          prerelease: false
